# Production / hosted-demo stack for FilsPay. See HOSTING.md.
#
#   cp ops/.env.production.example ops/.env.production   # then fill it in
#   docker compose -f ops/docker-compose.prod.yml up -d --build
#
# Only the web service (nginx) publishes a port (with the HTTPS overlay
# docker-compose.tls.yml, Caddy publishes 80/443 and web binds to
# 127.0.0.1:8080). It serves the merchant app at /, the admin console at
# /admin/ and proxies /v1/, /healthz and /readyz to the api. Postgres, the
# api and settlement stay on the internal network.
#
# Every service reads its settings and secrets from ops/.env.production
# (gitignored). ops/.env.docker is a dev file and is NOT used here.
#
# Sized for ONE server with 1 vCPU and 2 GB RAM (see CAPACITY.md). In this
# file the CPU limits add up to 1.0 and memory to 1.5 GB, so the OS and
# Docker keep about 0.5 GB. The HTTPS overlay (docker-compose.tls.yml) adds
# Caddy and raises Postgres; CPU caps then share the one vCPU. Only the API
# has the hosting rule's hard cap (0.5 vCPU / 512 MB):
#
#   service      cpus   memory
#   api          0.50   512M   (the hosting rule: 0.5 vCPU / 512 MB)
#   postgres     0.35   640M
#   web (nginx)  0.07    64M
#   settlement   0.03    64M
#   reporting    0.05   192M
#
# migrate and seed are one-off jobs that exit before the api starts.
# Every long-running service restarts itself (restart: always) and its logs
# are capped so they cannot fill the disk.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-node-service: &node-service
  build:
    context: ..
    dockerfile: ops/Dockerfile.node
  env_file: .env.production
  environment:
    NODE_ENV: production
  restart: always
  # Default for the one-off migrate/seed jobs; api and reporting set their own.
  cpus: 0.50
  mem_limit: 512m
  logging: *logging

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.production
    # Tuned for 0.35 CPU / 640 MB. max_connections covers the api pool (60),
    # settlement (5), reporting (5), psql and migrations, with room left.
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_parallel_workers_per_gather=0
    shm_size: 128m
    cpus: 0.35
    mem_limit: 640m
    logging: *logging
    environment:
      POSTGRES_USER: filspay
      POSTGRES_DB: filspay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: always

  # One-off: applies new db/migrations/*.sql, skips applied ones.
  migrate:
    <<: *node-service
    command: ["npm", "run", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: loads the demo data on an empty database only (db/seed/once.ts),
  # so a restart never wipes what users did. Remove for a real launch.
  seed:
    <<: *node-service
    command: ["npm", "run", "seed:once"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *node-service
    # One node process (no npx/tsx wrapper processes): less memory, and
    # SIGTERM reaches the app for a graceful shutdown.
    command: ["node", "--import", "tsx", "apps/api/src/index.ts"]
    cpus: 0.50
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      NODE_ENV: production
      # V8 heap well inside 512 MB; the rest is buffers, pg and native code.
      NODE_OPTIONS: --max-old-space-size=320
      PORT: "3000"
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
      KYC_UPLOAD_DIR: /app/data/kyc
      # A payment holds a connection while the acquirer answers (0.1-0.4 s),
      # so the pool, not the CPU, limits throughput first. Set here, not in
      # .env.production: reporting reads the same variable name.
      PG_POOL_MAX: "60"
      # All opened at boot and kept open (db/pool.ts warmPool): opening a
      # new connection in the middle of a load spike can time out.
      PG_POOL_MIN: "60"
      # Past capacity, answer 503 + Retry-After at once (plugins/loadShedding.ts).
      LOAD_SHED_MAX_POOL_WAITING: "30"
      LOAD_SHED_MAX_EVENT_LOOP_DELAY_MS: "150"
    volumes:
      - kyc:/app/data
    # Plain bash, no extra node process: cheap on 0.5 CPU.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    depends_on:
      seed:
        condition: service_completed_successfully

  settlement:
    build:
      context: ..
      dockerfile: ops/Dockerfile.go
    command: ["./settlement", "daemon"]
    env_file: .env.production
    restart: always
    cpus: 0.03
    mem_limit: 64m
    logging: *logging
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8091"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      seed:
        condition: service_completed_successfully

  reporting:
    <<: *node-service
    command: ["node", "--import", "tsx", "apps/reporting/src/index.ts"]
    cpus: 0.05
    mem_limit: 192m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
    depends_on:
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: ops/Dockerfile.web
    ports:
      - "${FILSPAY_HTTP_PORT:-80}:80"
    restart: always
    cpus: 0.07
    mem_limit: 64m
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  kyc:
