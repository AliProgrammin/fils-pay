# Optional HTTPS layer. Use with the prod file:
#   FILSPAY_DOMAIN=1-2-3-4.sslip.io FILSPAY_HTTP_PORT=127.0.0.1:8080 \
#   docker compose -f ops/docker-compose.prod.yml -f ops/docker-compose.tls.yml up -d --build
# Caddy takes ports 80/443 (port 80 only redirects to https). The web
# container moves to 127.0.0.1:8080, so it is not public: Docker-published
# ports skip ufw, so binding to 127.0.0.1 is what keeps it private.
services:
  caddy:
    image: caddy:2.10-alpine
    restart: always
    depends_on: [web]
    environment:
      FILSPAY_DOMAIN: ${FILSPAY_DOMAIN:?set FILSPAY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cpus: 0.40
    mem_limit: 96m
    # Caddy's admin API (on by default, bound to 127.0.0.1 inside the
    # container) answers only while Caddy runs.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # The hosting rule caps only the API (0.5 vCPU / 512 MB). The server has
  # 1 vCPU in total, so the other caps only stop one service from taking
  # the whole machine. Measured on the live 1 vCPU server: Postgres capped
  # at 0.30 limited the stack to about 30 users; at 0.90 it serves about 70
  # (CAPACITY.md, "Live server").
  postgres:
    cpus: 0.90

volumes:
  caddy_data:
  caddy_config:
