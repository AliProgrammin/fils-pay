# One origin for the whole app, so session cookies work without CORS:
#   /          merchant web app (apps/web)
#   /admin/    admin console (apps/admin, built with --base=/admin/)
#   /v1/, /healthz, /readyz   -> api service

# Overload guard (docs/submission/CAPACITY.md): at most 400 API requests in flight across
# all clients. Past that nginx answers 503 + Retry-After at once, before the
# api (0.5 vCPU) or nginx's own 1024 worker connections run out. The api
# sheds earlier by itself (plugins/loadShedding.ts); this is the outer wall.
limit_conn_zone $server_name zone=api_in_flight:1m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    # Relative redirects keep the port and scheme the browser used.
    absolute_redirect off;
    root /usr/share/nginx/html;

    # KYC uploads are up to 8 MiB (KYC_MAX_FILE_SIZE_BYTES).
    client_max_body_size 10m;

    # Docker's DNS, re-resolved each 30s, so a recreated api container
    # (new IP) is found without restarting nginx.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:3000;

    location /v1/ {
        limit_conn api_in_flight 400;
        limit_conn_status 503;
        # nginx's own 502/504 (api not reachable, e.g. while it restarts)
        # become a JSON 503 the client can retry. The api's own 502
        # (acquirer_unavailable) passes through: proxy_intercept_errors is off.
        error_page 502 503 504 = @api_unavailable;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Settlement batch runs go through the api and can be slow.
        proxy_read_timeout 120s;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 2 always;
        return 503 '{"error":"server_busy","message":"The server is at capacity or restarting. Retry after a short wait."}';
    }

    location = /healthz { proxy_pass $api_upstream; }
    location = /readyz  { proxy_pass $api_upstream; }

    # Vite puts content-hashed files under assets/; they never change.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /admin/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /admin { return 301 /admin/; }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
