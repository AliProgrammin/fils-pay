# One origin for the whole app, so session cookies work without CORS:
#   /          merchant web app (apps/web)
#   /admin/    admin console (apps/admin, built with --base=/admin/)
#   /v1/, /healthz, /readyz   -> api service
server {
    listen 80;
    server_name _;
    # Relative redirects keep the port and scheme the browser used.
    absolute_redirect off;
    root /usr/share/nginx/html;

    # KYC uploads are up to 8 MiB (KYC_MAX_FILE_SIZE_BYTES).
    client_max_body_size 10m;

    # Docker's DNS, re-resolved each 30s, so a recreated api container
    # (new IP) is found without restarting nginx.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:3000;

    location /v1/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Settlement batch runs go through the api and can be slow.
        proxy_read_timeout 120s;
    }

    location = /healthz { proxy_pass $api_upstream; }
    location = /readyz  { proxy_pass $api_upstream; }

    # Vite puts content-hashed files under assets/; they never change.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /admin/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /admin { return 301 /admin/; }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
