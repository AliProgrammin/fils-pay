name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # ci_password is a throwaway password for the CI-only database below.
  DATABASE_URL: postgres://filspay:ci_password@localhost:5432/filspay?sslmode=disable

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: filspay
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: filspay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filspay -d filspay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/settlement/go.mod
          cache-dependency-path: apps/settlement/go.sum

      - run: npm ci
      - run: npm run migrate
      - run: npm run typecheck
      - run: npm test
      # The Go tests read the seeded fixtures (for example fee schedules).
      - run: npm run seed
      - run: go test ./...
        working-directory: apps/settlement
